[workspace]
members = [
    "crates/command-model",
    "crates/control-plane",
    "crates/auth",
    "crates/policy",
    "crates/session-control",
    "crates/capability",
    "crates/command-bus",
    "crates/session",
    "crates/native-core",
    "crates/telemetry",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "Apache-2.0"
rust-version = "1.86"
version = "0.1.0"

[profile.release]
codegen-units = 1
lto = "thin"
panic = "abort"
