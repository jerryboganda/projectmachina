[package]
name = "machina-network"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Native URL, DNS, TLS and HTTP streaming loader with a fail-closed destination policy hook."

[dependencies]
machina-command-bus = { path = "../command-bus" }
tokio = { version = "1.42", features = ["rt-multi-thread", "net", "time", "sync", "macros", "io-util"] }
tokio-util = { version = "0.7", features = ["io"] }
hyper = { version = "1.5", features = ["client", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["tokio", "client"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pki-types = "1.10"
webpki-roots = "0.26"
url = "2.5"
bytes = "1.9"
http = "1.2"
http-body = "1.0"
http-body-util = "0.1"
async-compression = { version = "0.4", features = ["tokio", "gzip", "zlib", "brotli"] }
async-stream = "0.3"
futures-core = "0.3"
futures-util = { version = "0.3", default-features = false, features = ["std"] }

[features]
test-support = []

[dev-dependencies]
machina-network = { path = ".", features = ["test-support"] }
tokio = { version = "1.42", features = ["rt-multi-thread", "net", "time", "sync", "macros", "io-util", "process"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.135"
