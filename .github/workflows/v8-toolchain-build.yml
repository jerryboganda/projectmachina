name: v8-toolchain-build

# ---------------------------------------------------------------------------
# THIS WORKFLOW IS "STEP A" ONLY: V8 TOOLCHAIN PROVISIONING.
#
# It builds and packages the pinned V8 static-library artifacts
# (toolchains/versions.toml [v8].version) that a *future* task will link
# into cpp/v8-bridge/ + crates/runtime-v8/ (M2-T06 proper, per
# .agent-state/design/M2-T06-v8-bridge-design.md). This workflow does NOT
# write, build, or test any C++ bridge or Rust facade code. It only
# produces the two build artifact sets M2-T06's design calls for:
#   1. a non-sanitized release v8_monolith (functional correctness build)
#   2. an ASan+UBSan instrumented v8_monolith (Linux+Clang only — the
#      sanitizer job cannot run on Windows at all, per design §4)
# plus a provenance record for each (resolved commit SHA, GN args, SHA-256,
# build timestamp, runner facts) satisfying toolchains/V8_PROVENANCE.md.
#
# See .agent-state/design/M2-T06-toolchain-feasibility.md for the cost/risk
# analysis behind this being a separate, explicitly human-triggered task:
# a full V8 checkout + build is multi-GB and can realistically run from
# well under an hour to several hours depending on runner class, so this
# is NOT wired to push/pull_request/schedule. The owner decides when to
# spend the Actions minutes.
# ---------------------------------------------------------------------------

on:
  workflow_dispatch:
    inputs:
      v8_version:
        description: >-
          V8 version tag to build. Defaults to toolchains/versions.toml's
          pinned [v8].version. Only override for a deliberate one-off
          validation build; the pinned value is the source of truth for
          what M2-T06 proper is allowed to link against.
        required: false
        default: "13.1.201.12"

permissions:
  contents: read

concurrency:
  group: v8-toolchain-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------------
  # Leg A1 (design doc naming): non-sanitized release v8_monolith.
  # Runs on windows-latest deliberately, not because the eventual bridge
  # is Windows-only (it is not — it is cross-platform), but because the
  # feasibility doc's binding finding was that GitHub-hosted Windows
  # runners already ship Visual Studio Build Tools + Windows SDK, which
  # was the exact missing piece on the local dev machine. Using that
  # existing toolchain removes an entire class of first-attempt friction
  # for this leg specifically.
  # ---------------------------------------------------------------------
  build-non-sanitized:
    name: "Leg A1: non-sanitized v8_monolith (windows-latest)"
    runs-on: windows-latest
    timeout-minutes: 350
    defaults:
      run:
        shell: pwsh
    env:
      # Tells depot_tools' Windows toolchain hooks to detect a local
      # Visual Studio install via vswhere instead of trying to download
      # Google-internal toolchain packages (which non-Googlers cannot
      # access). This is the documented workaround for external
      # contributors building V8/Chromium on Windows.
      DEPOT_TOOLS_WIN_TOOLCHAIN: "0"
      DEPOT_TOOLS_UPDATE: "0"
      GIT_TERMINAL_PROMPT: "0"
    steps:
      - name: Checkout Project Machina (for this workflow's own context only)
        # v4.2.2 — same pin used by .github/workflows/fast-gate.yml
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Resolve requested V8 version and pinned-version drift check
        id: version
        run: |
          $requested = "${{ github.event.inputs.v8_version }}"
          if ([string]::IsNullOrWhiteSpace($requested)) { $requested = "13.1.201.12" }

          $lines = Get-Content toolchains/versions.toml
          $inV8Section = $false
          $pinnedVersion = $null
          foreach ($line in $lines) {
            if ($line -match '^\[v8\]') { $inV8Section = $true; continue }
            if ($inV8Section -and $line -match '^\[') { break }
            if ($inV8Section -and $line -match '^version\s*=\s*"(.+)"') { $pinnedVersion = $Matches[1]; break }
          }

          Write-Host "Requested V8 version: $requested"
          Write-Host "toolchains/versions.toml pinned V8 version: $pinnedVersion"
          if ($requested -ne $pinnedVersion) {
            Write-Warning "Requested version ($requested) differs from the pinned version ($pinnedVersion). This run's artifact is NOT the artifact M2-T06 proper is authorized to consume until versions.toml is updated to match."
          }
          echo "v8_version=$requested" >> $env:GITHUB_OUTPUT

      - name: Report runner facts (for provenance)
        id: runner_facts
        run: |
          $cpu = Get-CimInstance Win32_Processor
          $mem = Get-CimInstance Win32_ComputerSystem
          $os = Get-CimInstance Win32_OperatingSystem
          Write-Host "CPU: $($cpu.Name) ($($cpu.NumberOfLogicalProcessors) logical cores)"
          Write-Host "RAM: $([math]::Round($mem.TotalPhysicalMemory / 1GB, 1)) GB"
          Write-Host "OS: $($os.Caption) $($os.Version)"
          echo "cpu_desc=$($cpu.Name)" >> $env:GITHUB_OUTPUT
          echo "cpu_cores=$($cpu.NumberOfLogicalProcessors)" >> $env:GITHUB_OUTPUT
          echo "mem_gb=$([math]::Round($mem.TotalPhysicalMemory / 1GB, 1))" >> $env:GITHUB_OUTPUT
          echo "os_desc=$($os.Caption) $($os.Version)" >> $env:GITHUB_OUTPUT

      - name: Verify MSVC Build Tools are present
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (-not (Test-Path $vswhere)) {
            Write-Error "vswhere.exe not found; cannot detect a local Visual Studio install. This runner does not match the feasibility doc's expected baseline."
            exit 1
          }
          $vsInfo = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if ([string]::IsNullOrWhiteSpace($vsInfo)) {
            Write-Error "No Visual Studio install with the VC++ x86/x64 build tools component was found."
            exit 1
          }
          Write-Host "Found Visual Studio / Build Tools at: $vsInfo"

      - name: Check and reclaim disk space
        id: disk
        run: |
          # --- Which drive should host the checkout + build output? ---
          # GitHub-hosted windows-latest runners ship a second data disk
          # mounted as D: with substantially more free space than C: (C: is
          # crowded with preinstalled SDKs/tools; RUNNER_TEMP already
          # defaults to D:\a\_temp on these runners for the same reason).
          # Round 1 of this workflow hardcoded D:\ for the actual checkout
          # (D:\depot_tools, D:\v8-checkout) but this gate checked C:'s free
          # space instead of D:'s — an inconsistency that failed a run on a
          # runner that actually had enough room where it mattered. Detect
          # D: at runtime instead of assuming either way, and use whichever
          # drive is actually going to hold the checkout.
          $buildDriveLetter = if (Test-Path "D:\") { "D" } else { "C" }
          $buildRoot = "${buildDriveLetter}:\v8-build"
          Write-Host "Build drive resolved to: ${buildDriveLetter}: (checkout + build output will live under $buildRoot)"

          Write-Host "--- Drive inventory (diagnostic) ---"
          Get-PSDrive -PSProvider FileSystem | ForEach-Object {
            $usedGb = [math]::Round($_.Used / 1GB, 1)
            $freeGbDiag = [math]::Round($_.Free / 1GB, 1)
            Write-Host ("  {0}: {1}GB free, {2}GB used" -f $_.Name, $freeGbDiag, $usedGb)
          }

          # --- Threshold math (replaces the previous flat 50GB guess) ---
          # Per the M2-T06 toolchain feasibility analysis: V8 source + DEPS
          # is roughly a few GB up to ~6-8GB on disk; a release build's
          # output directory is roughly several GB up to ~15GB. 8 + 15 =
          # 23GB of real need; add ~30% margin (~7GB) for depot_tools' own
          # CIPD-fetched packages, intermediate ninja state, and general
          # slack => 30GB on the drive that hosts the checkout/build.
          $buildThresholdGb = 30
          # The OS drive (C:) needs its own, much smaller, headroom
          # regardless of where the checkout lives: CIPD/vpython3 caches,
          # pip, TEMP, and git's own state land there even when the heavy
          # checkout is on D:.
          $osThresholdGb = 10

          function Get-FreeGb($letter) {
            $d = Get-PSDrive -Name $letter -ErrorAction SilentlyContinue
            if (-not $d) { return $null }
            return [math]::Round($d.Free / 1GB, 1)
          }

          $buildFreeGb = Get-FreeGb $buildDriveLetter
          $cFreeGb = Get-FreeGb "C"
          Write-Host "Free space on build drive ${buildDriveLetter}: before cleanup: ${buildFreeGb}GB (need >= ${buildThresholdGb}GB; see threshold math above)"
          Write-Host "Free space on OS drive C: before cleanup: ${cFreeGb}GB (need >= ${osThresholdGb}GB headroom for toolchain caches/TEMP, independent of the build drive)"

          $needsCleanup = ($buildFreeGb -lt $buildThresholdGb) -or ($cFreeGb -lt $osThresholdGb)
          if ($needsCleanup) {
            Write-Host "Reclaiming space on C: by removing preinstalled toolchains not needed for a V8/GN/ninja build..."
            Write-Host "(Not touching Visual Studio, the Windows SDK, or Git — this build needs those.)"
            $candidates = @(
              # Whole hostedtoolcache — none of the cached Node/Python/Go/
              # Ruby/PyPy versions are used by this build; depot_tools
              # brings its own Python 3 via CIPD (see the "Bootstrap
              # depot_tools" step below).
              $env:AGENT_TOOLSDIRECTORY,
              "C:\hostedtoolcache\windows",
              "C:\Program Files (x86)\Android",
              "C:\Android",
              "C:\Program Files\dotnet",
              "C:\Program Files\Microsoft SQL Server",
              "C:\Program Files\Java",
              "C:\Program Files\Unity",
              "C:\Program Files (x86)\Microsoft SDKs\Azure",
              "C:\Program Files\Google\Chrome",
              "C:\Program Files\Mozilla Firefox",
              "C:\Program Files\Amazon",
              "C:\Program Files\Amazon\Corretto",
              "C:\Program Files\MongoDB",
              "C:\Program Files\Microsoft SDKs\Service Fabric",
              "C:\Program Files\Microsoft Service Fabric",
              "C:\Program Files\Azure Cosmos DB Emulator"
            )
            foreach ($path in $candidates) {
              if ($path -and (Test-Path $path)) {
                Write-Host "Removing $path"
                Remove-Item -Path $path -Recurse -Force -ErrorAction SilentlyContinue
              }
            }
            $buildFreeGb = Get-FreeGb $buildDriveLetter
            $cFreeGb = Get-FreeGb "C"
            Write-Host "Free space on build drive ${buildDriveLetter}: after cleanup: ${buildFreeGb}GB"
            Write-Host "Free space on OS drive C: after cleanup: ${cFreeGb}GB"
          }
          if (($buildFreeGb -lt $buildThresholdGb) -or ($cFreeGb -lt $osThresholdGb)) {
            Write-Error "Still short on disk after cleanup: build drive ${buildDriveLetter}: has ${buildFreeGb}GB (need >= ${buildThresholdGb}GB), OS drive C: has ${cFreeGb}GB (need >= ${osThresholdGb}GB). Failing fast rather than risking a partial multi-hour job that runs out of disk mid-build."
            exit 1
          }
          echo "free_gb_before_build=$buildFreeGb" >> $env:GITHUB_OUTPUT
          echo "build_drive=${buildDriveLetter}:" >> $env:GITHUB_OUTPUT
          echo "build_root=$buildRoot" >> $env:GITHUB_OUTPUT
          echo "V8_BUILD_ROOT=$buildRoot" >> $env:GITHUB_ENV
        timeout-minutes: 15

      - name: Configure git for a Chromium/V8-scale checkout
        run: |
          git config --global core.autocrlf false
          git config --global core.filemode false
          git config --global core.longpaths true
          git config --global http.postBuffer 524288000
          try {
            Set-ItemProperty -Path "HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem" -Name "LongPathsEnabled" -Value 1 -ErrorAction Stop
            Write-Host "Enabled Win32 long path support."
          } catch {
            Write-Warning "Could not set LongPathsEnabled (non-fatal, git core.longpaths=true is the primary mitigation): $_"
          }

      - name: Bootstrap depot_tools
        run: |
          $depotTools = "$env:V8_BUILD_ROOT\depot_tools"
          git clone --depth 1 https://chromium.googlesource.com/chromium/tools/depot_tools.git $depotTools
          echo "$depotTools" >> $env:GITHUB_PATH

          # --- One-time Python bootstrap, done explicitly regardless of DEPOT_TOOLS_UPDATE=0 ---
          # The job sets DEPOT_TOOLS_UPDATE=0 for every later depot_tools
          # invocation, to pin this depot_tools checkout instead of letting
          # each command silently self-update. `fetch`/`gclient` don't need
          # this bootstrap (they run via `vpython3`, which is CIPD-based and
          # self-contained). But `gn` is invoked via depot_tools'
          # `python-bin\python3` wrapper (see gn.bat), which requires
          # `python3_bin_reldir.txt` to exist — a file normally created as a
          # side effect of depot_tools' own auto-update/bootstrap machinery,
          # exactly what DEPOT_TOOLS_UPDATE=0 suppresses. Verified by reading
          # depot_tools' own scripts (gn.bat -> bootstrap\python3.bat reads
          # python3_bin_reldir.txt; update_depot_tools.bat only regenerates
          # it when DEPOT_TOOLS_UPDATE != 0, via bootstrap\win_tools.bat).
          # bootstrap\win_tools.bat is depot_tools' standalone "make the
          # Python bootstrap files exist" entrypoint: it installs the CIPD
          # Python package and runs bootstrap.py, but — unlike
          # update_depot_tools.bat — never does `git fetch`/`checkout
          # origin/main` on depot_tools itself, so calling it here does not
          # violate the "pinned depot_tools checkout" intent of
          # DEPOT_TOOLS_UPDATE=0. Run it once, up front, so later steps
          # (which keep DEPOT_TOOLS_UPDATE=0) find python3_bin_reldir.txt
          # already in place.
          Write-Host "Running depot_tools' one-time Python bootstrap (bootstrap\win_tools.bat) so python3_bin_reldir.txt exists before gn is invoked..."
          & "$depotTools\bootstrap\win_tools.bat"
          if ($LASTEXITCODE -ne 0) { Write-Error "depot_tools Python bootstrap (win_tools.bat) failed with exit code $LASTEXITCODE"; exit 1 }
          if (-not (Test-Path "$depotTools\python3_bin_reldir.txt")) {
            Write-Error "win_tools.bat completed but python3_bin_reldir.txt still does not exist at $depotTools; gn would fail later with the same error this fix targets."
            exit 1
          }
          Write-Host "Confirmed python3_bin_reldir.txt exists: $(Get-Content "$depotTools\python3_bin_reldir.txt")"
        timeout-minutes: 10

      - name: Fetch V8 and sync to the pinned revision
        id: fetch
        env:
          V8_VERSION: ${{ steps.version.outputs.v8_version }}
        run: |
          $depotTools = "$env:V8_BUILD_ROOT\depot_tools"
          $v8Checkout = "$env:V8_BUILD_ROOT\v8-checkout"
          $env:Path = "$depotTools;" + $env:Path
          New-Item -ItemType Directory -Path $v8Checkout | Out-Null
          Set-Location $v8Checkout

          Write-Host "Resolving V8 tag $env:V8_VERSION to an immutable commit SHA..."
          $lsRemote = git ls-remote https://chromium.googlesource.com/v8/v8.git "refs/tags/$env:V8_VERSION" "refs/tags/$env:V8_VERSION^{}"
          if ([string]::IsNullOrWhiteSpace($lsRemote)) {
            Write-Error "Tag $env:V8_VERSION does not exist on chromium.googlesource.com/v8/v8.git"
            exit 1
          }
          # Prefer the peeled (^{}) line if present — that is the commit an
          # annotated tag points at; otherwise the tag itself is a
          # lightweight tag pointing directly at the commit.
          $peeled = $lsRemote | Where-Object { $_ -match '\^\{\}$' }
          if ($peeled) {
            $commit = ($peeled -split "`t")[0]
          } else {
            $commit = ($lsRemote -split "`n")[0].Split("`t")[0]
          }
          Write-Host "Resolved commit: $commit"
          echo "commit=$commit" >> $env:GITHUB_OUTPUT

          Write-Host "Running depot_tools 'fetch v8' (standard documented V8 checkout flow, full history)..."
          fetch v8
          if ($LASTEXITCODE -ne 0) { Write-Error "fetch v8 failed with exit code $LASTEXITCODE"; exit 1 }

          Set-Location "$v8Checkout\v8"
          Write-Host "Checking out pinned commit $commit..."
          git fetch origin $commit
          git checkout $commit
          if ($LASTEXITCODE -ne 0) { Write-Error "git checkout of pinned commit failed"; exit 1 }

          Write-Host "Re-running gclient sync for the pinned revision's DEPS..."
          Set-Location $v8Checkout
          gclient sync -D
          if ($LASTEXITCODE -ne 0) { Write-Error "gclient sync failed with exit code $LASTEXITCODE"; exit 1 }
        timeout-minutes: 110

      - name: GN gen (release, non-sanitized)
        env:
          GN_ARGS: >-
            is_debug=false target_cpu="x64" is_clang=true
            v8_monolithic=true v8_use_external_startup_data=false
            is_component_build=false v8_enable_i18n_support=false
            symbol_level=0
        run: |
          $env:Path = "$env:V8_BUILD_ROOT\depot_tools;" + $env:Path
          Set-Location "$env:V8_BUILD_ROOT\v8-checkout\v8"
          Write-Host "GN args: $env:GN_ARGS"
          gn gen out.gn/x64.release --args="$env:GN_ARGS"
          if ($LASTEXITCODE -ne 0) { Write-Error "gn gen failed"; exit 1 }
          echo "$env:GN_ARGS" | Out-File -FilePath gn_args_used.txt -Encoding utf8
        timeout-minutes: 15

      - name: Ninja build v8_monolith
        run: |
          $env:Path = "$env:V8_BUILD_ROOT\depot_tools;" + $env:Path
          Set-Location "$env:V8_BUILD_ROOT\v8-checkout\v8"
          ninja -C out.gn/x64.release v8_monolith
          if ($LASTEXITCODE -ne 0) { Write-Error "ninja build failed with exit code $LASTEXITCODE"; exit 1 }
        timeout-minutes: 180

      - name: Package artifact and write provenance
        id: package
        env:
          V8_VERSION: ${{ steps.version.outputs.v8_version }}
          RESOLVED_COMMIT: ${{ steps.fetch.outputs.commit }}
          CPU_DESC: ${{ steps.runner_facts.outputs.cpu_desc }}
          CPU_CORES: ${{ steps.runner_facts.outputs.cpu_cores }}
          MEM_GB: ${{ steps.runner_facts.outputs.mem_gb }}
          OS_DESC: ${{ steps.runner_facts.outputs.os_desc }}
        run: |
          Set-Location "$env:V8_BUILD_ROOT\v8-checkout\v8"
          $lib = Get-ChildItem -Path out.gn\x64.release -Recurse -Filter "v8_monolith.lib" | Select-Object -First 1
          if (-not $lib) {
            Write-Error "v8_monolith.lib not found under out.gn/x64.release; build did not produce the expected artifact."
            exit 1
          }
          $outDir = "$env:GITHUB_WORKSPACE\v8-artifacts\non-sanitized"
          New-Item -ItemType Directory -Path $outDir -Force | Out-Null
          Copy-Item $lib.FullName "$outDir\v8_monolith.lib"
          $hash = (Get-FileHash "$outDir\v8_monolith.lib" -Algorithm SHA256).Hash.ToLower()
          $ts = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
          $gnArgs = Get-Content gn_args_used.txt -Raw

          $provenance = @{
            artifact_set     = "non-sanitized"
            v8_version_tag   = $env:V8_VERSION
            resolved_commit  = $env:RESOLVED_COMMIT
            source_repo      = "https://chromium.googlesource.com/v8/v8.git"
            gn_args          = $gnArgs.Trim()
            build_target     = "v8_monolith"
            artifact_file    = "v8_monolith.lib"
            artifact_sha256  = $hash
            build_timestamp  = $ts
            runner_os        = $env:OS_DESC
            runner_cpu       = $CPU_DESC
            runner_cpu_cores = $CPU_CORES
            runner_mem_gb    = $MEM_GB
            github_run_id    = "${{ github.run_id }}"
            github_run_url   = "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            workflow_file    = ".github/workflows/v8-toolchain-build.yml"
          }
          $provenance | ConvertTo-Json | Out-File -FilePath "$outDir\provenance.json" -Encoding utf8
          Write-Host "SHA-256: $hash"
          Get-Content "$outDir\provenance.json"
        timeout-minutes: 10

      - name: Upload non-sanitized artifact
        # v5.0.0
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        with:
          name: v8-monolith-non-sanitized-windows-x64
          path: v8-artifacts/non-sanitized
          retention-days: 14
          if-no-files-found: error

  # ---------------------------------------------------------------------
  # Leg A2 (design doc naming): ASan+UBSan instrumented v8_monolith.
  # MUST run on Linux+Clang — MSVC ASan is immature and explicitly
  # excluded by .agent-state/design/M2-T06-v8-bridge-design.md §4. There
  # is no Windows alternative for this leg; ubuntu-latest is mandatory,
  # not a preference.
  # ---------------------------------------------------------------------
  build-sanitized:
    name: "Leg A2: ASan/UBSan v8_monolith (ubuntu-latest, mandatory Linux leg)"
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      DEPOT_TOOLS_UPDATE: "0"
      GIT_TERMINAL_PROMPT: "0"
    steps:
      - name: Checkout Project Machina (for this workflow's own context only)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Resolve requested V8 version and pinned-version drift check
        id: version
        run: |
          set -euo pipefail
          requested="${{ github.event.inputs.v8_version }}"
          requested="${requested:-13.1.201.12}"
          pinned=$(awk '/^\[v8\]/{f=1;next} /^\[/{f=0} f && /^version *=/{gsub(/[" ]/,"",$3); print $3}' toolchains/versions.toml)
          echo "Requested V8 version: $requested"
          echo "toolchains/versions.toml pinned V8 version: $pinned"
          if [ "$requested" != "$pinned" ]; then
            echo "::warning::Requested version ($requested) differs from the pinned version ($pinned). This run's artifact is NOT the artifact M2-T06 proper is authorized to consume until versions.toml is updated to match."
          fi
          echo "v8_version=$requested" >> "$GITHUB_OUTPUT"

      - name: Report runner facts (for provenance)
        id: runner_facts
        run: |
          set -euo pipefail
          cpu_desc=$(lscpu | awk -F: '/Model name/{gsub(/^ +/,"",$2); print $2}')
          cpu_cores=$(nproc)
          mem_gb=$(awk '/MemTotal/{printf "%.1f", $2/1024/1024}' /proc/meminfo)
          os_desc=$(source /etc/os-release && echo "$PRETTY_NAME")
          echo "CPU: $cpu_desc ($cpu_cores logical cores)"
          echo "RAM: ${mem_gb}GB"
          echo "OS: $os_desc"
          {
            echo "cpu_desc=$cpu_desc"
            echo "cpu_cores=$cpu_cores"
            echo "mem_gb=$mem_gb"
            echo "os_desc=$os_desc"
          } >> "$GITHUB_OUTPUT"

      - name: Check and reclaim disk space
        id: disk
        timeout-minutes: 15
        run: |
          set -euo pipefail
          # --- Threshold math (replaces the previous flat 50GB guess) ---
          # Per the M2-T06 toolchain feasibility analysis: V8 source + DEPS
          # is roughly a few GB up to ~6-8GB on disk; a release build's
          # output directory is roughly several GB up to ~15GB for a
          # non-sanitized build. ASan+UBSan instrumentation (is_asan=true
          # is_ubsan=true, symbol_level=1 here) measurably inflates object
          # file and binary sizes versus a plain release build, so this leg
          # gets extra headroom on top of the non-sanitized 30GB figure:
          # 8 (source) + ~25 (instrumented output, allowing ~1.5-2x the
          # plain-release estimate) = ~33GB of real need; round up to 40GB
          # for margin. This is still well under the 50GB this leg already
          # cleared on ubuntu-latest, so it stays a real, verified-safe
          # tightening rather than a blind guess.
          threshold_gb=40
          echo "--- Filesystem inventory (diagnostic) ---"
          df -h / /mnt 2>/dev/null || df -h /
          avail_kb=$(df --output=avail / | tail -1)
          avail_gb=$((avail_kb / 1024 / 1024))
          echo "Free space on / before cleanup: ${avail_gb}GB (need >= ${threshold_gb}GB for a V8 checkout + ASan/UBSan build; see threshold math above)"
          if [ "$avail_gb" -lt "$threshold_gb" ]; then
            echo "Reclaiming space by removing preinstalled toolchains not needed for a V8/GN/ninja build..."
            sudo rm -rf /usr/share/dotnet || true
            sudo rm -rf /usr/local/lib/android || true
            sudo rm -rf /opt/ghc || true
            sudo rm -rf /opt/hostedtoolcache/CodeQL || true
            sudo rm -rf /usr/local/share/boost || true
            sudo rm -rf /usr/local/.ghcup || true
            sudo rm -rf "$AGENT_TOOLSDIRECTORY" || true
            sudo rm -rf /usr/local/lib/node_modules || true
            sudo rm -rf /usr/share/swift || true
            sudo rm -rf /usr/lib/google-cloud-sdk || true
            sudo docker image prune --all --force || true
            avail_kb=$(df --output=avail / | tail -1)
            avail_gb=$((avail_kb / 1024 / 1024))
            echo "Free space on / after cleanup: ${avail_gb}GB"
          fi
          if [ "$avail_gb" -lt "$threshold_gb" ]; then
            echo "::error::Still only ${avail_gb}GB free after cleanup (need >= ${threshold_gb}GB). Failing fast rather than risking a partial multi-hour job that runs out of disk mid-build."
            exit 1
          fi
          echo "free_gb_before_build=$avail_gb" >> "$GITHUB_OUTPUT"

      - name: Bootstrap depot_tools
        timeout-minutes: 10
        run: |
          set -euo pipefail
          git clone --depth 1 https://chromium.googlesource.com/chromium/tools/depot_tools.git "$HOME/depot_tools"
          echo "$HOME/depot_tools" >> "$GITHUB_PATH"

          # --- One-time Python bootstrap, done explicitly regardless of DEPOT_TOOLS_UPDATE=0 ---
          # The job sets DEPOT_TOOLS_UPDATE=0 for every later depot_tools
          # invocation, to pin this depot_tools checkout instead of letting
          # each command silently self-update. `fetch`/`gclient sync`
          # succeed fine under that setting because they run via
          # `vpython3`, which is CIPD-based and self-contained. `gn`,
          # however, is invoked via depot_tools' `python-bin/python3`
          # wrapper, which refuses to run unless `python3_bin_reldir.txt`
          # exists — a file normally created as a side effect of
          # depot_tools' own auto-update/bootstrap machinery, exactly what
          # DEPOT_TOOLS_UPDATE=0 suppresses. Verified by reading
          # depot_tools' own scripts: `python-bin/python3` errors with
          # "need to initialize depot_tools by running gclient,
          # update_depot_tools or ensure_bootstrap" when the file is
          # missing; `update_depot_tools` only creates it (via
          # `bootstrap_python3` -> `bootstrap/bootstrap.py`) when
          # DEPOT_TOOLS_UPDATE != 0. `ensure_bootstrap` is depot_tools'
          # documented standalone entrypoint for exactly this: per its own
          # --help text, "[u]nlike update_depot_tools, this script works
          # with the current checkout, and will not update/sync the
          # depot_tools repository" — it runs the same
          # bootstrap_python3/bootstrap.py step without ever doing `git
          # fetch`/`checkout origin/main` on depot_tools itself, so it does
          # not violate the "pinned depot_tools checkout" intent of
          # DEPOT_TOOLS_UPDATE=0. Run it once, up front, so later steps
          # (which keep DEPOT_TOOLS_UPDATE=0) find python3_bin_reldir.txt
          # already in place.
          echo "Running depot_tools' one-time Python bootstrap (./ensure_bootstrap) so python3_bin_reldir.txt exists before gn is invoked..."
          "$HOME/depot_tools/ensure_bootstrap"
          if [ ! -f "$HOME/depot_tools/python3_bin_reldir.txt" ]; then
            echo "::error::ensure_bootstrap completed but python3_bin_reldir.txt still does not exist at $HOME/depot_tools; gn would fail later with the same error this fix targets."
            exit 1
          fi
          echo "Confirmed python3_bin_reldir.txt exists: $(cat "$HOME/depot_tools/python3_bin_reldir.txt")"

      - name: Fetch V8 and sync to the pinned revision
        id: fetch
        timeout-minutes: 110
        env:
          V8_VERSION: ${{ steps.version.outputs.v8_version }}
        run: |
          set -euo pipefail
          export PATH="$HOME/depot_tools:$PATH"
          mkdir -p "$HOME/v8-checkout"
          cd "$HOME/v8-checkout"

          echo "Resolving V8 tag $V8_VERSION to an immutable commit SHA..."
          ls_remote_out=$(git ls-remote https://chromium.googlesource.com/v8/v8.git "refs/tags/$V8_VERSION" "refs/tags/$V8_VERSION^{}")
          if [ -z "$ls_remote_out" ]; then
            echo "::error::Tag $V8_VERSION does not exist on chromium.googlesource.com/v8/v8.git"
            exit 1
          fi
          peeled=$(echo "$ls_remote_out" | grep '\^{}$' || true)
          if [ -n "$peeled" ]; then
            commit=$(echo "$peeled" | cut -f1)
          else
            commit=$(echo "$ls_remote_out" | head -1 | cut -f1)
          fi
          echo "Resolved commit: $commit"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"

          echo "Running depot_tools 'fetch v8' (standard documented V8 checkout flow, full history)..."
          fetch v8

          cd "$HOME/v8-checkout/v8"
          echo "Checking out pinned commit $commit..."
          git fetch origin "$commit"
          git checkout "$commit"

          echo "Re-running gclient sync for the pinned revision's DEPS..."
          cd "$HOME/v8-checkout"
          gclient sync -D

      - name: GN gen (release, ASan+UBSan)
        timeout-minutes: 15
        env:
          GN_ARGS: >-
            is_debug=false target_cpu="x64" is_clang=true
            v8_monolithic=true v8_use_external_startup_data=false
            is_component_build=false v8_enable_i18n_support=false
            is_asan=true is_ubsan=true symbol_level=1
        run: |
          set -euo pipefail
          export PATH="$HOME/depot_tools:$PATH"
          cd "$HOME/v8-checkout/v8"
          echo "GN args: $GN_ARGS"
          gn gen out.gn/x64.release.asan-ubsan --args="$GN_ARGS"
          echo "$GN_ARGS" > gn_args_used.txt

      - name: Ninja build v8_monolith (ASan+UBSan)
        timeout-minutes: 180
        run: |
          set -euo pipefail
          export PATH="$HOME/depot_tools:$PATH"
          cd "$HOME/v8-checkout/v8"
          ninja -C out.gn/x64.release.asan-ubsan v8_monolith

      - name: Package artifact and write provenance
        id: package
        timeout-minutes: 10
        env:
          V8_VERSION: ${{ steps.version.outputs.v8_version }}
          RESOLVED_COMMIT: ${{ steps.fetch.outputs.commit }}
          CPU_DESC: ${{ steps.runner_facts.outputs.cpu_desc }}
          CPU_CORES: ${{ steps.runner_facts.outputs.cpu_cores }}
          MEM_GB: ${{ steps.runner_facts.outputs.mem_gb }}
          OS_DESC: ${{ steps.runner_facts.outputs.os_desc }}
        run: |
          set -euo pipefail
          cd "$HOME/v8-checkout/v8"
          lib=$(find out.gn/x64.release.asan-ubsan -name "libv8_monolith.a" | head -1)
          if [ -z "$lib" ]; then
            echo "::error::libv8_monolith.a not found under out.gn/x64.release.asan-ubsan; build did not produce the expected artifact."
            exit 1
          fi
          out_dir="$GITHUB_WORKSPACE/v8-artifacts/sanitized"
          mkdir -p "$out_dir"
          cp "$lib" "$out_dir/libv8_monolith.a"
          hash=$(sha256sum "$out_dir/libv8_monolith.a" | cut -d ' ' -f1)
          ts=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          gn_args=$(cat gn_args_used.txt)

          run_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          cat > "$out_dir/provenance.json" <<JSON
          {
            "artifact_set": "sanitized-asan-ubsan",
            "v8_version_tag": "$V8_VERSION",
            "resolved_commit": "$RESOLVED_COMMIT",
            "source_repo": "https://chromium.googlesource.com/v8/v8.git",
            "gn_args": "$gn_args",
            "build_target": "v8_monolith",
            "artifact_file": "libv8_monolith.a",
            "artifact_sha256": "$hash",
            "build_timestamp": "$ts",
            "runner_os": "$OS_DESC",
            "runner_cpu": "$CPU_DESC",
            "runner_cpu_cores": "$CPU_CORES",
            "runner_mem_gb": "$MEM_GB",
            "github_run_id": "${{ github.run_id }}",
            "github_run_url": "$run_url",
            "workflow_file": ".github/workflows/v8-toolchain-build.yml"
          }
          JSON
          echo "SHA-256: $hash"
          cat "$out_dir/provenance.json"

      - name: Upload sanitized artifact
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        with:
          name: v8-monolith-asan-ubsan-linux-x64
          path: v8-artifacts/sanitized
          retention-days: 14
          if-no-files-found: error
