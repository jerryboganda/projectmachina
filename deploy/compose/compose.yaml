name: machina-local

services:
  postgres:
    image: postgres:16.4
    environment:
      POSTGRES_DB: machina
      POSTGRES_USER: machina
      POSTGRES_PASSWORD: machina-local-only
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - machina-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U machina -d machina"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7.4.1
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - machina-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  object-store:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: machina-local
      MINIO_ROOT_PASSWORD: machina-local-only
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - machina-object-store:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10

  fixture:
    image: node:20.18.0-bookworm-slim
    command:
      - node
      - -e
      - >-
        require("http").createServer((req,res)=>{
        res.writeHead(200,{"content-type":"application/json"});
        res.end(JSON.stringify({fixture_set:"machina-foundation",external_network:false}));
        }).listen(8080,"0.0.0.0")
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 10

  observability:
    image: prom/prometheus:v2.55.1
    ports:
      - "127.0.0.1:9090:9090"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9090/-/ready >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  machina-postgres:
  machina-redis:
  machina-object-store:
