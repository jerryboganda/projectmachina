name: machina-local

services:
  postgres:
    image: postgres:16.4
    environment:
      POSTGRES_DB: machina
      POSTGRES_USER: machina
      POSTGRES_PASSWORD: machina-local-only
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - machina-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U machina -d machina"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7.4.1
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - machina-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  object-store:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: machina-local
      MINIO_ROOT_PASSWORD: machina-local-only
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - machina-object-store:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  machina-postgres:
  machina-redis:
  machina-object-store:
